name: CI/CD — Build, Push, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/db-assistant-framework

jobs:

  # ════════════════════════════════════════════════════════════
  #  JOB 1 — LINT & SYNTAX CHECK
  #
  #  Lint (ruff)   — warns only, never blocks the deploy.
  #                  Style issues are printed in the Actions log
  #                  so you can fix them when convenient.
  #
  #  Syntax check  — BLOCKING. A syntax error or undefined name
  #                  that crashes on import stops the pipeline
  #                  before broken code reaches the server .
  # ════════════════════════════════════════════════════════════
  test:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff) — warn only, does not block deploy
        run: ruff check . --select E,F,W --ignore E501,E402 || true

      - name: Syntax check — BLOCKING
        run: |
          python -m py_compile agents/serializability_agent.py
          python -m py_compile agents/parallel_query_agent.py
          python -m py_compile api/app.py
          python -m py_compile orchestrator.py
          python -m py_compile llm_factory.py
          python -m py_compile tools/db_ops.py
          python -m py_compile evals/run_evals.py
          echo "All files passed syntax check"

  # ════════════════════════════════════════════════════════════
  #  JOB 2 — BUILD & PUSH TO DOCKERHUB
  #  (only on push to main, not on pull_request)
  # ════════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker image pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════
  #  JOB 3 — DEPLOY TO AZURE VM
  # ════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key:      ${{ secrets.AZURE_VM_SSH_KEY }}
          port:     22
          script: |
            set -e

            echo "── Pulling latest image ──"
            docker pull ${{ env.IMAGE_NAME }}:latest

            echo "── Stopping old container (if running) ──"
            docker stop db-assistant || true
            docker rm   db-assistant || true

            echo "── Starting new container ──"
            docker run -d \
              --name db-assistant \
              --restart unless-stopped \
              -p 80:8000 \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              -v /etc/db-assistant/config.json:/app/config.json:ro \
              ${{ env.IMAGE_NAME }}:latest

            echo "── Waiting for health check ──"
            sleep 10
            curl -f http://localhost/health && echo "OK" || (docker logs db-assistant && exit 1)

            echo "── Pruning old images ──"
            docker image prune -f

      - name: Deployment summary
        run: |
          echo "### Deployed to Azure VM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Host: \`${{ secrets.AZURE_VM_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: http://${{ secrets.AZURE_VM_HOST }}" >> $GITHUB_STEP_SUMMARY
