<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Semi-Join Diagram Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d1117;
  color: #e6edf3;
  font: 13px/1.5 'Segoe UI', system-ui, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── Header / toolbar ── */
#header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 7px 14px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  flex-shrink: 0;
}
#header h1 { font-size: 13px; font-weight: 600; color: #58a6ff; }
#toolbar { display: flex; gap: 4px; align-items: center; }
.tbtn {
  background: #21262d;
  color: #c9d1d9;
  border: 1px solid #30363d;
  padding: 4px 11px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.1s;
}
.tbtn:hover  { background: #30363d; }
.tbtn.active { background: #1f6feb; border-color: #388bfd; color: #fff; }
.tbtn.danger { color: #f85149; }
.tbtn.danger:hover { background: #2d1616; border-color: #f85149; }
.tsep { width: 1px; height: 18px; background: #30363d; margin: 0 4px; }

/* ── Workspace ── */
#workspace { flex: 1; display: flex; overflow: hidden; }

/* ── Canvas ── */
#canvas {
  flex: 1;
  display: block;
  background: #161b22;
  background-image: radial-gradient(circle, #2a2f3a 1px, transparent 1px);
  background-size: 24px 24px;
}

/* ── Floating name-input popup ── */
#name-popup {
  display: none;
  position: fixed;
  z-index: 100;
  background: #1c2128;
  border: 1px solid #58a6ff;
  border-radius: 8px;
  padding: 8px 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  flex-direction: column;
  gap: 6px;
  min-width: 180px;
}
#name-popup label { font-size: 11px; color: #8b949e; }
#name-popup input {
  background: #0d1117;
  color: #e6edf3;
  border: 1px solid #30363d;
  border-radius: 5px;
  padding: 5px 8px;
  font-size: 13px;
  width: 100%;
}
#name-popup input:focus { outline: none; border-color: #58a6ff; }
#name-popup .popup-hint { font-size: 10px; color: #484f58; }

/* ── Inspector ── */
#inspector {
  width: 210px;
  flex-shrink: 0;
  background: #0d1117;
  border-left: 1px solid #30363d;
  overflow-y: auto;
  padding: 14px 12px;
}
.insp-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: #8b949e; margin-bottom: 8px;
}
.field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.field label { font-size: 11px; color: #8b949e; }
.field input {
  background: #21262d; color: #e6edf3;
  border: 1px solid #30363d; border-radius: 5px;
  padding: 4px 8px; font-size: 12px; font-family: inherit; width: 100%;
}
.field input:focus { outline: none; border-color: #58a6ff; }
.field input[type="color"]  { padding: 2px 3px; height: 28px; cursor: pointer; }
.field input[type="number"] { -moz-appearance: textfield; }
.field input[type="number"]::-webkit-inner-spin-button { display: none; }
.insp-section { display: none; }
.insp-section.vis { display: block; }
#insp-hint {
  color: #484f58; font-size: 12px; text-align: center;
  margin-top: 30px; line-height: 1.9;
}
#insp-hint kbd {
  background: #21262d; border: 1px solid #444c56;
  border-radius: 3px; padding: 1px 5px;
  font-size: 10px; font-family: monospace;
}

/* ── Footer ── */
#footer {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 14px;
  background: #161b22; border-top: 1px solid #30363d;
  flex-shrink: 0;
}
#status { flex: 1; font-size: 12px; color: #8b949e; }
#btn-submit {
  background: #238636; color: #fff;
  border: 1px solid #2ea043;
  padding: 5px 18px; border-radius: 6px;
  font-size: 12px; font-weight: 600; cursor: pointer;
}
#btn-submit:hover { background: #2ea043; }
#btn-submit:disabled {
  background: #21262d; border-color: #30363d;
  color: #8b949e; cursor: not-allowed;
}
</style>
</head>
<body>

<div id="header">
  <h1>Semi-Join Diagram</h1>
  <div id="toolbar">
    <button class="tbtn active" data-tool="select"  title="Select / Move  (V)">↖ Select</button>
    <button class="tbtn"        data-tool="ellipse" title="Add Table Ellipse  (E)">⬭ Ellipse</button>
    <button class="tbtn"        data-tool="point"   title="Add Column Point  (P)">• Point</button>
    <div class="tsep"></div>
    <button class="tbtn danger" id="btn-del"   title="Delete selected  (Del)">✕ Delete</button>
    <button class="tbtn"        id="btn-clear" title="Clear canvas">Clear</button>
  </div>
</div>

<!-- Floating column-name input, shown on Point placement -->
<div id="name-popup">
  <label>Column name</label>
  <input id="name-input" type="text" placeholder="e.g. id, price, …" autocomplete="off">
  <div class="popup-hint">Enter ↵ to place &nbsp;·&nbsp; Esc to cancel</div>
</div>

<div id="workspace">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <g id="g-ellipses"></g>
    <g id="g-points"></g>
  </svg>

  <div id="inspector">
    <div id="insp-hint">
      Select an element<br>to edit properties.<br><br>
      <kbd>V</kbd> Select &nbsp;&nbsp; <kbd>E</kbd> Ellipse<br>
      <kbd>P</kbd> Point &nbsp;&nbsp;&nbsp; <kbd>Del</kbd> Delete<br>
      <kbd>Esc</kbd> Cancel
    </div>

    <!-- Ellipse inspector -->
    <div id="insp-ellipse" class="insp-section">
      <div class="insp-title">Table</div>
      <div class="field"><label>Name</label><input id="ie-name"   type="text"   placeholder="R"></div>
      <div class="field"><label>Blocks</label><input id="ie-blocks" type="number" placeholder="10000" min="0"></div>
      <div class="field"><label>Distribution</label><input id="ie-dist" type="text" placeholder="hash(id)"></div>
      <div class="field"><label>Attributes</label><input id="ie-attrs" type="number" placeholder="4" min="1"></div>
      <div class="field"><label>Width (rx)</label><input id="ie-rx" type="number" placeholder="90" min="30"></div>
      <div class="field"><label>Height (ry)</label><input id="ie-ry" type="number" placeholder="60" min="20"></div>
      <div class="field"><label>Color</label><input id="ie-color" type="color" value="#3b82f6"></div>
    </div>

    <!-- Point inspector -->
    <div id="insp-point" class="insp-section">
      <div class="insp-title">Column Point</div>
      <div class="field"><label>Column name</label><input id="ip-name"  type="text" placeholder="id"></div>
      <div class="field"><label>Color</label>       <input id="ip-color" type="color" value="#fbbf24"></div>
    </div>
  </div>
</div>

<div id="footer">
  <span id="status">Ready</span>
  <button id="btn-submit">Submit Graph ↗</button>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════════

let ellipses = []; // {id, x, y, rx, ry, name, blocks, dist, attrs, color}
let points   = []; // {id, x, y, name, color}
let sel      = null;   // null | {kind:'ellipse'|'point', id}
let tool     = 'select';
let drag     = null;   // {kind, id, ox, oy}
let pendingPoint = null; // {x, y} — canvas position awaiting name input

const ELLIPSE_PALETTE = ['#3b82f6','#f97316','#22c55e','#a855f7','#ec4899','#14b8a6'];
const POINT_COLOR     = '#fbbf24';
let eColorSeq = 0;
let idSeq     = 0;
const uid = () => 'x' + (++idSeq);

// ══════════════════════════════════════════════════════════════
//  DOM refs
// ══════════════════════════════════════════════════════════════

const canvas     = document.getElementById('canvas');
const gEllipses  = document.getElementById('g-ellipses');
const gPoints    = document.getElementById('g-points');
const statusEl   = document.getElementById('status');
const inspHint   = document.getElementById('insp-hint');
const inspEll    = document.getElementById('insp-ellipse');
const inspPt     = document.getElementById('insp-point');
const namePopup  = document.getElementById('name-popup');
const nameInput  = document.getElementById('name-input');

// ══════════════════════════════════════════════════════════════
//  SVG helpers
// ══════════════════════════════════════════════════════════════

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  if (parent) parent.appendChild(e);
  return e;
}
function svgPt(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
function hex2rgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ══════════════════════════════════════════════════════════════
//  Hit testing
// ══════════════════════════════════════════════════════════════

function ellipseAt(x, y) {
  for (let i = ellipses.length - 1; i >= 0; i--) {
    const e = ellipses[i];
    if ((x-e.x)**2/e.rx**2 + (y-e.y)**2/e.ry**2 <= 1) return e;
  }
  return null;
}
function pointAt(x, y) {
  for (let i = points.length - 1; i >= 0; i--) {
    const p = points[i];
    if ((x-p.x)**2 + (y-p.y)**2 <= 12**2) return p;
  }
  return null;
}

// ══════════════════════════════════════════════════════════════
//  CRUD
// ══════════════════════════════════════════════════════════════

function addEllipse(x, y) {
  const color = ELLIPSE_PALETTE[eColorSeq++ % ELLIPSE_PALETTE.length];
  const e = { id: uid(), x, y, rx: 90, ry: 60, name: 'Table', blocks: '', dist: '', attrs: '', color };
  ellipses.push(e);
  render();
  setsel('ellipse', e.id);
  status('Ellipse placed. Edit properties in the panel →');
}

function addPoint(x, y, name) {
  const p = { id: uid(), x, y, name: name || '?', color: POINT_COLOR };
  points.push(p);
  render();
  setsel('point', p.id);
  status(`Point "${p.name}" placed.`);
}

function deleteSelected() {
  if (!sel) return;
  if (sel.kind === 'ellipse') ellipses = ellipses.filter(e => e.id !== sel.id);
  else                        points   = points.filter(p => p.id !== sel.id);
  setsel(null, null);
  render();
}

// ══════════════════════════════════════════════════════════════
//  Selection & inspector
// ══════════════════════════════════════════════════════════════

function setsel(kind, id) {
  sel = kind ? { kind, id } : null;
  syncInspector();
  render();
}

function syncInspector() {
  inspHint.style.display = 'none';
  inspEll.classList.remove('vis');
  inspPt.classList.remove('vis');

  if (!sel) { inspHint.style.display = 'block'; return; }

  if (sel.kind === 'ellipse') {
    const e = ellipses.find(e => e.id === sel.id); if (!e) return;
    inspEll.classList.add('vis');
    document.getElementById('ie-name').value   = e.name;
    document.getElementById('ie-blocks').value = e.blocks;
    document.getElementById('ie-dist').value   = e.dist;
    document.getElementById('ie-attrs').value  = e.attrs;
    document.getElementById('ie-rx').value     = e.rx;
    document.getElementById('ie-ry').value     = e.ry;
    document.getElementById('ie-color').value  = e.color;
  } else {
    const p = points.find(p => p.id === sel.id); if (!p) return;
    inspPt.classList.add('vis');
    document.getElementById('ip-name').value  = p.name;
    document.getElementById('ip-color').value = p.color;
  }
}

// Inspector → state bindings
(function bindInputs() {
  function onEll(id, fn) {
    document.getElementById(id).addEventListener('input', () => {
      if (sel?.kind !== 'ellipse') return;
      const e = ellipses.find(e => e.id === sel.id); if (!e) return;
      fn(e, document.getElementById(id).value); render();
    });
  }
  onEll('ie-name',   (e,v) => { e.name   = v; });
  onEll('ie-blocks', (e,v) => { e.blocks = v; });
  onEll('ie-dist',   (e,v) => { e.dist   = v; });
  onEll('ie-attrs',  (e,v) => { e.attrs  = v; });
  onEll('ie-rx',     (e,v) => { e.rx = Math.max(30, +v || 90); });
  onEll('ie-ry',     (e,v) => { e.ry = Math.max(20, +v || 60); });
  onEll('ie-color',  (e,v) => { e.color  = v; });

  function onPt(id, fn) {
    document.getElementById(id).addEventListener('input', () => {
      if (sel?.kind !== 'point') return;
      const p = points.find(p => p.id === sel.id); if (!p) return;
      fn(p, document.getElementById(id).value); render();
    });
  }
  onPt('ip-name',  (p,v) => { p.name  = v; });
  onPt('ip-color', (p,v) => { p.color = v; });
})();

// ══════════════════════════════════════════════════════════════
//  Render
// ══════════════════════════════════════════════════════════════

function render() {
  gEllipses.innerHTML = '';
  gPoints.innerHTML   = '';
  ellipses.forEach(renderEllipse);
  points.forEach(renderPoint);
}

function renderEllipse(e) {
  const isSel = sel?.kind === 'ellipse' && sel.id === e.id;
  const g = el('g', {}, gEllipses);

  if (isSel) {
    el('ellipse', {
      cx: e.x, cy: e.y, rx: e.rx + 7, ry: e.ry + 7,
      fill: 'none', stroke: '#58a6ff', 'stroke-width': 1.5, 'stroke-dasharray': '5 3',
    }, g);
  }

  // Semi-transparent fill — overlapping ellipses produce visible Venn intersection
  el('ellipse', {
    cx: e.x, cy: e.y, rx: e.rx, ry: e.ry,
    fill: hex2rgba(e.color, 0.30),
    stroke: e.color, 'stroke-width': 2.5,
  }, g);

  // Multi-line label
  const lines = [e.name || '?'];
  if (e.blocks) lines.push('blocks: ' + e.blocks);
  if (e.dist)   lines.push(e.dist);
  if (e.attrs)  lines.push('attrs: ' + e.attrs);
  const lh = 15, top = e.y - (lines.length - 1) * lh / 2;
  lines.forEach((txt, i) => {
    const t = el('text', {
      x: e.x, y: top + i * lh,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: '#f0f6fc',
      'font-size': i === 0 ? 14 : 10,
      'font-weight': i === 0 ? 700 : 400,
      'font-family': 'Segoe UI, system-ui, sans-serif',
      'pointer-events': 'none',
    }, g);
    t.textContent = txt;
  });

  // Resize handle — right edge (rx) and bottom edge (ry)
  addResizeHandle(g, e, 'rx');
  addResizeHandle(g, e, 'ry');

  g.style.cursor = 'grab';
  g.addEventListener('mousedown', ev => { ev.stopPropagation(); onEllipseDown(ev, e.id); });
}

function addResizeHandle(parent, e, axis) {
  const hx = axis === 'rx' ? e.x + e.rx : e.x;
  const hy = axis === 'rx' ? e.y         : e.y + e.ry;
  const h = el('rect', {
    x: hx - 5, y: hy - 5, width: 10, height: 10, rx: 2,
    fill: '#21262d', stroke: '#58a6ff', 'stroke-width': 1.5,
    style: `cursor:${axis === 'rx' ? 'ew-resize' : 'ns-resize'}`,
  }, parent);
  h.addEventListener('mousedown', ev => {
    ev.stopPropagation();
    const startM = axis === 'rx' ? ev.clientX : ev.clientY;
    const startV = axis === 'rx' ? e.rx       : e.ry;
    const onMove = mv => {
      const delta = (axis === 'rx' ? mv.clientX : mv.clientY) - startM;
      if (axis === 'rx') e.rx = Math.max(30, startV + delta);
      else               e.ry = Math.max(20, startV + delta);
      render();
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
}

function renderPoint(p) {
  const isSel = sel?.kind === 'point' && sel.id === p.id;
  const g = el('g', {}, gPoints);

  if (isSel) {
    el('circle', {
      cx: p.x, cy: p.y, r: 16,
      fill: 'none', stroke: '#58a6ff', 'stroke-width': 1.5, 'stroke-dasharray': '4 3',
    }, g);
  }

  // Filled dot
  el('circle', {
    cx: p.x, cy: p.y, r: 8,
    fill: p.color, stroke: '#0d1117', 'stroke-width': 1.5,
  }, g);

  // Column name label (below the dot)
  const txt = el('text', {
    x: p.x, y: p.y + 20,
    'text-anchor': 'middle', 'dominant-baseline': 'middle',
    fill: '#f0f6fc',
    'font-size': 12, 'font-weight': 600,
    'font-family': 'Segoe UI, system-ui, sans-serif',
    'pointer-events': 'none',
  }, g);
  txt.textContent = p.name;

  g.style.cursor = 'grab';
  g.addEventListener('mousedown', ev => { ev.stopPropagation(); onPointDown(ev, p.id); });
}

// ══════════════════════════════════════════════════════════════
//  Point name popup
// ══════════════════════════════════════════════════════════════

function showNamePopup(canvasX, canvasY) {
  // Position popup near the click in screen coordinates
  const rect = canvas.getBoundingClientRect();
  const sx = rect.left + canvasX + 14;
  const sy = rect.top  + canvasY - 10;

  namePopup.style.display = 'flex';
  namePopup.style.left    = `${sx}px`;
  namePopup.style.top     = `${sy}px`;
  nameInput.value         = '';
  nameInput.focus();
}

function hideNamePopup() {
  namePopup.style.display = 'none';
  pendingPoint = null;
}

nameInput.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') {
    ev.preventDefault();
    const name = nameInput.value.trim();
    if (pendingPoint && name) {
      addPoint(pendingPoint.x, pendingPoint.y, name);
    }
    hideNamePopup();
  } else if (ev.key === 'Escape') {
    hideNamePopup();
    status('Cancelled. Click canvas to place a point.');
  }
});

// Clicking outside the popup cancels it
document.addEventListener('mousedown', ev => {
  if (pendingPoint && !namePopup.contains(ev.target)) {
    hideNamePopup();
  }
}, true);

// ══════════════════════════════════════════════════════════════
//  Mouse event handlers
// ══════════════════════════════════════════════════════════════

function onEllipseDown(ev, id) {
  if (tool === 'select' || tool === 'ellipse') {
    if (tool === 'ellipse') setTool('select');
    setsel('ellipse', id);
    const p = svgPt(ev);
    const e = ellipses.find(e => e.id === id);
    drag = { kind: 'ellipse', id, ox: p.x - e.x, oy: p.y - e.y };
  }
  // In point mode: clicking an existing shape starts a point on top of it
  else if (tool === 'point') {
    const p = svgPt(ev);
    pendingPoint = p;
    showNamePopup(p.x, p.y);
  }
}

function onPointDown(ev, id) {
  if (tool !== 'select') return;
  setsel('point', id);
  const p   = svgPt(ev);
  const pt  = points.find(p => p.id === id);
  drag = { kind: 'point', id, ox: p.x - pt.x, oy: p.y - pt.y };
}

// Canvas background click
canvas.addEventListener('mousedown', ev => {
  if (ev.target !== canvas) return;
  if (tool === 'ellipse') {
    addEllipse(...Object.values(svgPt(ev)));
  } else if (tool === 'point') {
    const p = svgPt(ev);
    pendingPoint = p;
    showNamePopup(p.x, p.y);
  } else {
    setsel(null, null);
  }
});

window.addEventListener('mousemove', ev => {
  if (!drag) return;
  const p = svgPt(ev);
  if (drag.kind === 'ellipse') {
    const e = ellipses.find(e => e.id === drag.id);
    if (e) { e.x = p.x - drag.ox; e.y = p.y - drag.oy; render(); }
  } else {
    const pt = points.find(pt => pt.id === drag.id);
    if (pt) { pt.x = p.x - drag.ox; pt.y = p.y - drag.oy; render(); }
  }
});
window.addEventListener('mouseup', () => { drag = null; });

// Keyboard shortcuts
window.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  const k = ev.key;
  if      (k === 'v' || k === 'V') setTool('select');
  else if (k === 'e' || k === 'E') setTool('ellipse');
  else if (k === 'p' || k === 'P') setTool('point');
  else if (k === 'Delete' || k === 'Backspace') { ev.preventDefault(); deleteSelected(); }
  else if (k === 'Escape') { hideNamePopup(); setsel(null, null); status('Ready.'); }
});

// ══════════════════════════════════════════════════════════════
//  Tool switching
// ══════════════════════════════════════════════════════════════

function setTool(t) {
  tool = t;
  hideNamePopup();
  document.querySelectorAll('.tbtn[data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === t);
  });
  canvas.style.cursor = t === 'ellipse' ? 'crosshair' : t === 'point' ? 'cell' : 'default';
  status(
    t === 'ellipse' ? 'Click canvas to place a table ellipse.' :
    t === 'point'   ? 'Click anywhere to place a column point — a name prompt will appear.' :
                      'Click to select. Drag to move. Drag ◾ handles to resize ellipses.'
  );
}

document.querySelectorAll('.tbtn[data-tool]').forEach(b =>
  b.addEventListener('click', () => setTool(b.dataset.tool))
);
document.getElementById('btn-del').addEventListener('click', deleteSelected);
document.getElementById('btn-clear').addEventListener('click', () => {
  if ((ellipses.length || points.length) && !confirm('Clear everything?')) return;
  ellipses = []; points = []; setsel(null, null); render();
  status('Canvas cleared.');
});

// ══════════════════════════════════════════════════════════════
//  Submit
// ══════════════════════════════════════════════════════════════

document.getElementById('btn-submit').addEventListener('click', () => {
  if (!ellipses.length && !points.length) {
    status('Nothing to submit — draw something first.');
    return;
  }
  const graph = {
    ellipses: ellipses.map(e => ({
      id: e.id, x: Math.round(e.x), y: Math.round(e.y), rx: e.rx, ry: e.ry,
      name: e.name, blocks: e.blocks, dist: e.dist, attrs: e.attrs, color: e.color,
    })),
    points: points.map(p => ({
      id: p.id, x: Math.round(p.x), y: Math.round(p.y),
      name: p.name, color: p.color,
    })),
  };
  document.getElementById('btn-submit').disabled = true;
  status('Submitting…');
  fetch('/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(graph),
  })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(() => { status('Graph submitted. You can close this window.'); })
  .catch(() => {
    status('Submit failed. Try again.');
    document.getElementById('btn-submit').disabled = false;
  });
});

// ══════════════════════════════════════════════════════════════
//  Status helper & init
// ══════════════════════════════════════════════════════════════

function status(msg) { statusEl.textContent = msg; }

render();
status('Ready — E: ellipse · P: point · V: select · Del: delete');
</script>
</body>
</html>
