<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Cube Hasse Diagram Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d1117;
  color: #e6edf3;
  font: 13px/1.5 'Segoe UI', system-ui, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── Header ── */
#header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 7px 14px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  flex-shrink: 0;
}
#header h1 { font-size: 13px; font-weight: 600; color: #58a6ff; }
#toolbar { display: flex; gap: 4px; align-items: center; }
.tbtn {
  background: #21262d; color: #c9d1d9;
  border: 1px solid #30363d;
  padding: 4px 11px; border-radius: 6px;
  font-size: 12px; cursor: pointer; transition: background 0.1s;
}
.tbtn:hover  { background: #30363d; }
.tbtn.active { background: #1f6feb; border-color: #388bfd; color: #fff; }
.tbtn.danger { color: #f85149; }
.tbtn.danger:hover { background: #2d1616; border-color: #f85149; }
.tsep { width: 1px; height: 18px; background: #30363d; margin: 0 4px; }

/* ── Workspace ── */
#workspace { flex: 1; display: flex; overflow: hidden; }

/* ── Canvas ── */
#canvas {
  flex: 1; display: block;
  background: #161b22;
  background-image: radial-gradient(circle, #2a2f3a 1px, transparent 1px);
  background-size: 24px 24px;
}

/* ── Ellipse popup (two-field form) ── */
#ep-popup {
  display: none;
  position: fixed;
  z-index: 100;
  background: #1c2128;
  border: 1px solid #58a6ff;
  border-radius: 8px;
  padding: 10px 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.7);
  flex-direction: column;
  gap: 7px;
  min-width: 190px;
}
#ep-popup .ep-row { display: flex; flex-direction: column; gap: 2px; }
#ep-popup label { font-size: 11px; color: #8b949e; }
#ep-popup input {
  background: #0d1117; color: #e6edf3;
  border: 1px solid #30363d; border-radius: 5px;
  padding: 5px 8px; font-size: 13px; width: 100%;
}
#ep-popup input:focus { outline: none; border-color: #58a6ff; }
#ep-popup .ep-hint { font-size: 10px; color: #484f58; }
#ep-popup .ep-btns { display: flex; gap: 6px; margin-top: 2px; }
#ep-popup button {
  flex: 1; padding: 4px 8px; border-radius: 5px; font-size: 12px; cursor: pointer;
}
#ep-ok  { background: #1f6feb; border: 1px solid #388bfd; color: #fff; }
#ep-ok:hover { background: #388bfd; }
#ep-cancel { background: #21262d; border: 1px solid #30363d; color: #8b949e; }
#ep-cancel:hover { background: #30363d; }

/* ── Inspector ── */
#inspector {
  width: 210px; flex-shrink: 0;
  background: #0d1117; border-left: 1px solid #30363d;
  overflow-y: auto; padding: 14px 12px;
}
.insp-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: #8b949e; margin-bottom: 8px;
}
.field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.field label { font-size: 11px; color: #8b949e; }
.field input {
  background: #21262d; color: #e6edf3;
  border: 1px solid #30363d; border-radius: 5px;
  padding: 4px 8px; font-size: 12px; font-family: inherit; width: 100%;
}
.field input:focus { outline: none; border-color: #58a6ff; }
.field input[type="color"]  { padding: 2px 3px; height: 28px; cursor: pointer; }
.field input[type="number"] { -moz-appearance: textfield; }
.field input[type="number"]::-webkit-inner-spin-button { display: none; }
.insp-section { display: none; }
.insp-section.vis { display: block; }
.insp-info { font-size: 12px; color: #8b949e; line-height: 1.8; }
#insp-hint {
  color: #484f58; font-size: 12px; text-align: center;
  margin-top: 30px; line-height: 1.9;
}
#insp-hint kbd {
  background: #21262d; border: 1px solid #444c56;
  border-radius: 3px; padding: 1px 5px;
  font-size: 10px; font-family: monospace;
}

/* ── Footer ── */
#footer {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 14px;
  background: #161b22; border-top: 1px solid #30363d; flex-shrink: 0;
}
#status { flex: 1; font-size: 12px; color: #8b949e; }
#btn-submit {
  background: #238636; color: #fff;
  border: 1px solid #2ea043;
  padding: 5px 18px; border-radius: 6px;
  font-size: 12px; font-weight: 600; cursor: pointer;
}
#btn-submit:hover { background: #2ea043; }
#btn-submit:disabled { background: #21262d; border-color: #30363d; color: #8b949e; cursor: not-allowed; }
</style>
</head>
<body>

<div id="header">
  <h1>Hasse Diagram Editor — Data Cube</h1>
  <div id="toolbar">
    <button class="tbtn active" data-tool="select"  title="Select / Move  (V)">↖ Select</button>
    <button class="tbtn"        data-tool="ellipse" title="Add Cube Node  (E)">⬭ Cube</button>
    <button class="tbtn"        data-tool="connect" title="Connect: parent → child  (C)">→ Connect</button>
    <div class="tsep"></div>
    <button class="tbtn danger" id="btn-del"   title="Delete selected  (Del)">✕ Delete</button>
    <button class="tbtn"        id="btn-clear" title="Clear canvas">Clear</button>
  </div>
</div>

<!-- Ellipse creation popup: name + cost -->
<div id="ep-popup">
  <div class="ep-row"><label>Cube name</label><input id="ep-name" type="text"   placeholder="A" autocomplete="off"></div>
  <div class="ep-row"><label>Access cost</label><input id="ep-cost" type="number" placeholder="300" min="0"></div>
  <div class="ep-hint">Tab between fields · Enter or OK to place · Esc to cancel</div>
  <div class="ep-btns">
    <button id="ep-ok">OK</button>
    <button id="ep-cancel">Cancel</button>
  </div>
</div>

<div id="workspace">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah"  viewBox="0 0 10 7" markerWidth="8" markerHeight="6"
              refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/>
      </marker>
      <marker id="ahs" viewBox="0 0 10 7" markerWidth="8" markerHeight="6"
              refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/>
      </marker>
    </defs>
    <g id="g-edges"></g>
    <g id="g-nodes"></g>
    <line id="temp-line" display="none"
          stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5 3"
          pointer-events="none"/>
  </svg>

  <div id="inspector">
    <div id="insp-hint">
      Select an element<br>to edit properties.<br><br>
      <kbd>V</kbd> Select &nbsp;&nbsp; <kbd>E</kbd> Cube<br>
      <kbd>C</kbd> Connect &nbsp; <kbd>Del</kbd> Delete<br>
      <kbd>Esc</kbd> Cancel
    </div>

    <div id="insp-ellipse" class="insp-section">
      <div class="insp-title">Cube Node</div>
      <div class="field"><label>Name</label>       <input id="ie-name"  type="text"></div>
      <div class="field"><label>Access cost</label><input id="ie-cost"  type="number" min="0"></div>
      <div class="field"><label>Width (rx)</label> <input id="ie-rx"    type="number" min="30"></div>
      <div class="field"><label>Height (ry)</label><input id="ie-ry"    type="number" min="20"></div>
      <div class="field"><label>Color</label>      <input id="ie-color" type="color"></div>
    </div>

    <div id="insp-edge" class="insp-section">
      <div class="insp-title">Connection</div>
      <div id="ie-edge-info" class="insp-info"></div>
    </div>
  </div>
</div>

<div id="footer">
  <span id="status">Ready</span>
  <button id="btn-submit">Submit Graph ↗</button>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════════

let ellipses = []; // {id, x, y, rx, ry, name, cost, color}
let edges    = []; // {id, src, tgt}  — directed: src=parent, tgt=child
let sel      = null;   // null | {kind:'ellipse'|'edge', id}
let tool     = 'select';
let drag     = null;   // {id, ox, oy}
let conn     = null;   // {srcId}  — first click of connect
let pending  = null;   // {x, y}   — canvas pos awaiting popup confirmation

const PALETTE = ['#3b82f6','#f97316','#22c55e','#a855f7','#ec4899','#14b8a6','#f59e0b'];
let colorSeq = 0, idSeq = 0;
const uid = () => 'x' + (++idSeq);

// ══════════════════════════════════════════════════════════════
//  DOM refs
// ══════════════════════════════════════════════════════════════

const canvas    = document.getElementById('canvas');
const gEdges    = document.getElementById('g-edges');
const gNodes    = document.getElementById('g-nodes');
const tempLine  = document.getElementById('temp-line');
const statusEl  = document.getElementById('status');
const inspHint  = document.getElementById('insp-hint');
const inspEll   = document.getElementById('insp-ellipse');
const inspEdge  = document.getElementById('insp-edge');
const popup     = document.getElementById('ep-popup');
const epName    = document.getElementById('ep-name');
const epCost    = document.getElementById('ep-cost');

// ══════════════════════════════════════════════════════════════
//  SVG / geometry helpers
// ══════════════════════════════════════════════════════════════

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  if (parent) parent.appendChild(e);
  return e;
}
function svgPt(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
function hex2rgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function borderPt(cx, cy, rx, ry, tx, ty) {
  const dx = tx-cx, dy = ty-cy;
  if (!dx && !dy) return {x: cx+rx, y: cy};
  const t = 1/Math.sqrt((dx/rx)**2+(dy/ry)**2);
  return {x: cx+t*dx, y: cy+t*dy};
}
function ellipseAt(x, y) {
  for (let i = ellipses.length-1; i >= 0; i--) {
    const e = ellipses[i];
    if ((x-e.x)**2/e.rx**2+(y-e.y)**2/e.ry**2 <= 1) return e;
  }
  return null;
}
function nameOf(id) {
  return (ellipses.find(e => e.id===id)||{}).name || id;
}

// ══════════════════════════════════════════════════════════════
//  CRUD
// ══════════════════════════════════════════════════════════════

function addEllipse(x, y, name, cost) {
  const color = PALETTE[colorSeq++ % PALETTE.length];
  const e = { id: uid(), x, y, rx: 70, ry: 48, name: name||'?', cost: cost||0, color };
  ellipses.push(e);
  render(); setsel('ellipse', e.id);
  status(`Cube "${e.name}" (cost ${e.cost}) placed.`);
}

function addEdge(srcId, tgtId) {
  if (srcId===tgtId) return;
  if (edges.some(e => e.src===srcId && e.tgt===tgtId)) return; // no duplicates
  const e = { id: uid(), src: srcId, tgt: tgtId };
  edges.push(e);
  render(); setsel('edge', e.id);
  status(`Connected ${nameOf(srcId)} → ${nameOf(tgtId)}.`);
}

function deleteSelected() {
  if (!sel) return;
  if (sel.kind==='ellipse') {
    edges = edges.filter(e => e.src!==sel.id && e.tgt!==sel.id);
    ellipses = ellipses.filter(e => e.id!==sel.id);
  } else {
    edges = edges.filter(e => e.id!==sel.id);
  }
  setsel(null,null); render();
}

// ══════════════════════════════════════════════════════════════
//  Selection & inspector
// ══════════════════════════════════════════════════════════════

function setsel(kind, id) {
  sel = kind ? {kind,id} : null;
  syncInsp(); render();
}

function syncInsp() {
  inspHint.style.display='none';
  inspEll.classList.remove('vis');
  inspEdge.classList.remove('vis');
  if (!sel) { inspHint.style.display='block'; return; }
  if (sel.kind==='ellipse') {
    const e = ellipses.find(e=>e.id===sel.id); if(!e) return;
    inspEll.classList.add('vis');
    document.getElementById('ie-name').value  = e.name;
    document.getElementById('ie-cost').value  = e.cost;
    document.getElementById('ie-rx').value    = e.rx;
    document.getElementById('ie-ry').value    = e.ry;
    document.getElementById('ie-color').value = e.color;
  } else {
    const ed = edges.find(e=>e.id===sel.id); if(!ed) return;
    inspEdge.classList.add('vis');
    document.getElementById('ie-edge-info').textContent =
      `${nameOf(ed.src)}  →  ${nameOf(ed.tgt)}\n(parent → child)`;
  }
}

// Inspector → state
(function bindInputs(){
  function on(id, fn) {
    document.getElementById(id).addEventListener('input', () => {
      if (sel?.kind!=='ellipse') return;
      const e = ellipses.find(e=>e.id===sel.id); if(!e) return;
      fn(e, document.getElementById(id).value); render();
    });
  }
  on('ie-name',  (e,v)=>{ e.name=v; });
  on('ie-cost',  (e,v)=>{ e.cost=+v||0; });
  on('ie-rx',    (e,v)=>{ e.rx=Math.max(30,+v||70); });
  on('ie-ry',    (e,v)=>{ e.ry=Math.max(20,+v||48); });
  on('ie-color', (e,v)=>{ e.color=v; });
})();

// ══════════════════════════════════════════════════════════════
//  Render
// ══════════════════════════════════════════════════════════════

function render() {
  gEdges.innerHTML=''; gNodes.innerHTML='';
  edges.forEach(renderEdge);
  ellipses.forEach(renderEllipse);
}

function renderEllipse(e) {
  const isSel = sel?.kind==='ellipse' && sel.id===e.id;
  const g = el('g',{},gNodes);

  if (isSel)
    el('ellipse',{cx:e.x,cy:e.y,rx:e.rx+7,ry:e.ry+7,
      fill:'none',stroke:'#58a6ff','stroke-width':1.5,'stroke-dasharray':'5 3'},g);

  el('ellipse',{cx:e.x,cy:e.y,rx:e.rx,ry:e.ry,
    fill:hex2rgba(e.color,0.28),stroke:e.color,'stroke-width':2.5},g);

  // Labels: name (bold, large) + cost (smaller)
  const nameT = el('text',{x:e.x,y:e.y-8,
    'text-anchor':'middle','dominant-baseline':'middle',
    fill:'#f0f6fc','font-size':15,'font-weight':700,
    'font-family':'Segoe UI,system-ui,sans-serif','pointer-events':'none'},g);
  nameT.textContent = e.name || '?';

  const costT = el('text',{x:e.x,y:e.y+11,
    'text-anchor':'middle','dominant-baseline':'middle',
    fill:'#94a3b8','font-size':11,
    'font-family':'Segoe UI,system-ui,sans-serif','pointer-events':'none'},g);
  costT.textContent = e.cost !== '' ? `cost: ${e.cost}` : '';

  // Resize handles
  addHandle(g, e, 'rx');
  addHandle(g, e, 'ry');

  g.style.cursor = tool==='connect' ? 'crosshair' : 'grab';
  g.addEventListener('mousedown', ev=>{ ev.stopPropagation(); onNodeDown(ev,e.id); });
}

function addHandle(parent, e, axis) {
  const hx = axis==='rx' ? e.x+e.rx : e.x;
  const hy = axis==='rx' ? e.y      : e.y+e.ry;
  const h = el('rect',{x:hx-5,y:hy-5,width:10,height:10,rx:2,
    fill:'#21262d',stroke:'#58a6ff','stroke-width':1.5,
    style:`cursor:${axis==='rx'?'ew-resize':'ns-resize'}`},parent);
  h.addEventListener('mousedown', ev=>{
    ev.stopPropagation();
    const start = axis==='rx'?ev.clientX:ev.clientY;
    const sv    = axis==='rx'?e.rx:e.ry;
    const mv = m=>{ const d=(axis==='rx'?m.clientX:m.clientY)-start;
      if(axis==='rx') e.rx=Math.max(30,sv+d); else e.ry=Math.max(20,sv+d);
      render(); };
    const up = ()=>{ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
  });
}

function renderEdge(ed) {
  const src = ellipses.find(e=>e.id===ed.src);
  const tgt = ellipses.find(e=>e.id===ed.tgt);
  if (!src||!tgt) return;

  const isSel  = sel?.kind==='edge' && sel.id===ed.id;
  const color  = isSel ? '#a78bfa' : '#94a3b8';
  const marker = isSel ? 'url(#ahs)' : 'url(#ah)';

  const s = borderPt(src.x,src.y,src.rx,src.ry,tgt.x,tgt.y);
  const t = borderPt(tgt.x,tgt.y,tgt.rx,tgt.ry,src.x,src.y);

  el('line',{x1:s.x,y1:s.y,x2:t.x,y2:t.y,
    stroke:color,'stroke-width':isSel?2.5:2,'marker-end':marker},gEdges);

  // Wide invisible hit zone
  const hit = el('line',{x1:s.x,y1:s.y,x2:t.x,y2:t.y,
    stroke:'transparent','stroke-width':14,style:'cursor:pointer'},gEdges);
  hit.addEventListener('mousedown',ev=>{ ev.stopPropagation(); setsel('edge',ed.id); });
}

// ══════════════════════════════════════════════════════════════
//  Ellipse popup
// ══════════════════════════════════════════════════════════════

function showPopup(canvasX, canvasY) {
  const r = canvas.getBoundingClientRect();
  popup.style.display = 'flex';
  popup.style.left    = `${r.left + canvasX + 14}px`;
  popup.style.top     = `${r.top  + canvasY - 10}px`;
  epName.value = ''; epCost.value = '';
  epName.focus();
}

function hidePopup() {
  popup.style.display = 'none';
  pending = null;
}

function confirmPopup() {
  const name = epName.value.trim();
  const cost = parseFloat(epCost.value) || 0;
  if (pending && name) addEllipse(pending.x, pending.y, name, cost);
  hidePopup();
}

epName.addEventListener('keydown', ev=>{
  if (ev.key==='Tab') { ev.preventDefault(); epCost.focus(); }
  else if (ev.key==='Enter') confirmPopup();
  else if (ev.key==='Escape') { hidePopup(); status('Cancelled.'); }
});
epCost.addEventListener('keydown', ev=>{
  if (ev.key==='Enter') confirmPopup();
  else if (ev.key==='Escape') { hidePopup(); status('Cancelled.'); }
});
document.getElementById('ep-ok').addEventListener('click', confirmPopup);
document.getElementById('ep-cancel').addEventListener('click', ()=>{ hidePopup(); status('Cancelled.'); });

// Close popup when clicking outside
document.addEventListener('mousedown', ev=>{
  if (pending && !popup.contains(ev.target)) hidePopup();
}, true);

// ══════════════════════════════════════════════════════════════
//  Mouse handlers
// ══════════════════════════════════════════════════════════════

function onNodeDown(ev, id) {
  if (tool==='select') {
    setsel('ellipse',id);
    const p=svgPt(ev), e=ellipses.find(e=>e.id===id);
    drag={id,ox:p.x-e.x,oy:p.y-e.y};
  } else if (tool==='ellipse') {
    setTool('select'); setsel('ellipse',id);
  } else if (tool==='connect') {
    if (!conn) {
      conn={srcId:id};
      tempLine.removeAttribute('display');
      status(`Source: "${nameOf(id)}" — now click the child cube.`);
    } else if (conn.srcId!==id) {
      addEdge(conn.srcId, id);
      conn=null; tempLine.setAttribute('display','none');
    }
  }
}

canvas.addEventListener('mousedown', ev=>{
  if (ev.target!==canvas) return;
  const p = svgPt(ev);
  if (tool==='ellipse') {
    pending = p; showPopup(p.x, p.y);
  } else if (tool==='connect') {
    conn=null; tempLine.setAttribute('display','none');
    status('Cancelled. Click a cube to start a connection.');
  } else {
    setsel(null,null);
  }
});

window.addEventListener('mousemove', ev=>{
  if (drag) {
    const p=svgPt(ev), e=ellipses.find(e=>e.id===drag.id);
    if(e){ e.x=p.x-drag.ox; e.y=p.y-drag.oy; render(); }
  }
  if (conn) {
    const p=svgPt(ev), src=ellipses.find(e=>e.id===conn.srcId);
    if(src){
      const s=borderPt(src.x,src.y,src.rx,src.ry,p.x,p.y);
      tempLine.setAttribute('x1',s.x); tempLine.setAttribute('y1',s.y);
      tempLine.setAttribute('x2',p.x); tempLine.setAttribute('y2',p.y);
    }
  }
});
window.addEventListener('mouseup',()=>{ drag=null; });

window.addEventListener('keydown', ev=>{
  if (ev.target.tagName==='INPUT') return;
  const k=ev.key;
  if      (k==='v'||k==='V') setTool('select');
  else if (k==='e'||k==='E') setTool('ellipse');
  else if (k==='c'||k==='C') setTool('connect');
  else if (k==='Delete'||k==='Backspace'){ ev.preventDefault(); deleteSelected(); }
  else if (k==='Escape'){ hidePopup(); conn=null; tempLine.setAttribute('display','none'); setsel(null,null); status('Ready.'); }
});

// ══════════════════════════════════════════════════════════════
//  Tool switching
// ══════════════════════════════════════════════════════════════

function setTool(t) {
  tool=t; conn=null; tempLine.setAttribute('display','none'); hidePopup();
  document.querySelectorAll('.tbtn[data-tool]').forEach(b=>
    b.classList.toggle('active', b.dataset.tool===t));
  canvas.style.cursor = t==='ellipse'?'crosshair': t==='connect'?'cell':'default';
  status(
    t==='ellipse' ? 'Click canvas to place a cube. A name+cost prompt will appear.' :
    t==='connect' ? 'Click the PARENT cube, then the CHILD cube.' :
                    'Click to select. Drag to move. Drag ◾ handles to resize.'
  );
}

document.querySelectorAll('.tbtn[data-tool]').forEach(b=>
  b.addEventListener('click',()=>setTool(b.dataset.tool)));
document.getElementById('btn-del').addEventListener('click', deleteSelected);
document.getElementById('btn-clear').addEventListener('click', ()=>{
  if((ellipses.length||edges.length)&&!confirm('Clear everything?')) return;
  ellipses=[]; edges=[]; setsel(null,null); render(); status('Canvas cleared.');
});

// ══════════════════════════════════════════════════════════════
//  Submit
// ══════════════════════════════════════════════════════════════

document.getElementById('btn-submit').addEventListener('click', ()=>{
  if (!ellipses.length){ status('Add at least one cube node first.'); return; }
  const graph = {
    ellipses: ellipses.map(e=>({
      id:e.id, x:Math.round(e.x), y:Math.round(e.y), rx:e.rx, ry:e.ry,
      name:e.name, cost:e.cost, color:e.color,
    })),
    edges: edges.map(e=>({ id:e.id, src:e.src, tgt:e.tgt })),
  };
  document.getElementById('btn-submit').disabled=true;
  status('Submitting…');
  fetch('/submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(graph),
  })
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(()=>{ status('Graph submitted. You can close this window.'); })
  .catch(()=>{ status('Submit failed.'); document.getElementById('btn-submit').disabled=false; });
});

// ── init ──
function status(m){ statusEl.textContent=m; }
render();
status('Ready — E: add cube · C: connect parent→child · V: select · Del: delete');
</script>
</body>
</html>
